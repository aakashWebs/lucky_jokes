<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I'm Feeling Lucky - Jokes</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
      text-align: center;
      width: 90%;
      max-width: 500px;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    select, button {
      font-size: 18px;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      margin: 10px 5px;
      outline: none;
    }

    select {
      background-color: #f1f1f1;
    }

    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    #joke {
      margin-top: 30px;
      font-size: 20px;
      color: #444;
      min-height: 80px;
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hey Buddy,Are you Feeling Lucky</h1>
    <div>
      <select id="jokeType">
        <option value="english">English</option>
        <option value="hindi">Hindi</option>
        <option value="meme">Meme</option>
      </select>
      <button id="luckyBtn">Get Joke</button>
    </div>
    <div id="joke">Your joke will appear here...</div>
  </div>

  <script>
    document.getElementById('luckyBtn').addEventListener('click', function () {
      const type = document.getElementById('jokeType').value;
      fetch(`/random_joke?type=${type}`)
        .then(response => response.json())
        .then(data => {
            console.log(data);
            if (type === 'meme') {
              document.getElementById('joke').innerHTML = `<strong>${data.joke.title}</strong><br><img src="${data.joke.url}" alt="Meme" style="max-width: 100%; border-radius: 8px;">`;
            } else {
              document.getElementById('joke').textContent = data.joke;
            }
        })
        .catch(error => {
          document.getElementById('joke').textContent = 'Oops! Something went wrong.';
        });
    });
  </script>
</body>
</html>
